# This file is GENERATED by scripts/build_data.py — do not edit directly.
# Edit structure.yml (category/subcategory order) and the item files in
# tools/, members/, examples/ and profiles/ (one file per item) instead,
# then re-run the script.
#
# Primary categories describe what a tool does.
# second_path entries classify the same item by DDI standard/version without duplication.
# DDI-CDI, SDTL and XKOS are intentionally empty until supporting tools are added.
# The current queXML -> DDI Codebook 2.1 relationship is retained but marked for verification.
# DDI versions are no longer stored in summary_release_rate.

categories:
- name: DDI Members
  subcategories:
  - name: Premium Members
    items:
    - name: GESIS - Leibniz Institute for the Social Sciences
      homepage_url: https://www.gesis.org/
      logo: gesis.svg
      description: GESIS is one of the world’s leading infrastructure institutions for the
        social sciences and supports researchers with expertise and infrastructure services
        at all levels of their research projects. We help to ensure that socially relevant
        questions can be answered on the basis of reliable data, the latest scientific methods,
        and research information. We help with study planning and data collection, provide
        high-quality research data, support with data processing and analysis, and finally
        with archiving the data.
      extra:
        annotations:
          designated_member_representative: Wolfgang Zenk-Möltgen
          scientific_board_member: Wolfgang Zenk-Möltgen
    - name: Inter-university Consortium for Political and Social Research (ICPSR)
      homepage_url: https://www.icpsr.umich.edu/
      logo: icpsr.png
      description: ICPSR is an international consortium of 800+ academic and research bodies.
        We provide leadership and training in data access, curation, and analytical methods
        for social science. Collaborating with funders, including federal US agencies, ICPSR
        develops themed data collections and projects. Our research delves into digital curation
        challenges and policy initiatives. We established the Summer Program in Quantitative
        Methods in 1963, educating tens of thousands of researchers in introductory to advanced
        training in statistics, data analysis, and quantitative research methods.
      extra:
        annotations:
          designated_member_representative: Sanda Ionescu
          executive_board_member: Margaret Levenstein, Jared Lyle (ex officio)
          scientific_board_member: Jared Lyle (ex officio)
          executive_director: Jared Lyle
