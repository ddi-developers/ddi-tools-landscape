name: Inter-university Consortium for Political and Social Research (ICPSR)
homepage_url: https://www.icpsr.umich.edu/
logo: icpsr.png
description: ICPSR is an international consortium of 800+ academic and research bodies. We provide leadership and training in data access, curation, and analytical methods for social science. Collaborating with funders, including federal US agencies, ICPSR develops themed data collections and projects. Our research delves into digital curation challenges and policy initiatives. We established the Summer Program in Quantitative Methods in 1963, educating tens of thousands of researchers in introductory to advanced training in statistics, data analysis, and quantitative research methods.
