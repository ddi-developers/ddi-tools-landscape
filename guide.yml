categories:
- category: DDI Members
  subcategories:
  - subcategory: Premium Members
    content: |
      - **[GESIS - Leibniz Institute for the Social Sciences](https://www.gesis.org/)**: GESIS is one of the world’s leading infrastructure institutions for the social sciences and supports researchers with expertise and infrastructure services at all levels of their research projects. We help to ensure that socially relevant questions can be answered on the basis of reliable data, the latest scientific methods, and research information. We help with study planning and data collection, provide high-quality research data, support with data processing and analysis, and finally with archiving the data.
      - **[Inter-university Consortium for Political and Social Research (ICPSR)](https://www.icpsr.umich.edu/)**: ICPSR is an international consortium of 800+ academic and research bodies. We provide leadership and training in data access, curation, and analytical methods for social science. Collaborating with funders, including federal US agencies, ICPSR develops themed data collections and projects. Our research delves into digital curation challenges and policy initiatives. We established the Summer Program in Quantitative Methods in 1963, educating tens of thousands of researchers in introductory to advanced training in statistics, data analysis, and quantitative research methods.
  - subcategory: Full Members
    content: |
      - **[Center for Socio-Political Data (CDSP), Sciences Po](https://cdsp.sciences-po.fr/fr/)**: Founded in 2005, the Centre for Sociopolitical Data provides a range of data-related infrastructures and services for the social sciences.
- category: DDI Authoring & Design
  subcategories:
  - subcategory: Questionnaire Editors
    content: |
      Tools focused on authoring and editing questionnaire metadata, typically in DDI-Lifecycle. These applications help teams document routing, mappings, question–variable relationships, and export DDI-compliant artifacts for reuse across the DDI ecosystem.

      - **[Archivist](https://github.com/CLOSER-Cohorts/archivist)**: Easy-to-use editor for documenting questionnaires, routing, and mappings; exports DDI-Lifecycle.
  - subcategory: Metadata Editors
    content: |
      General-purpose DDI editors for describing studies, variables, and data structures. These tools often support DDI 2.x (Codebook) and/or DDI 3.x (Lifecycle) authoring workflows.

      - **[DDI 3.0 Editor-Lite](http://www.ddialliance.org/hubfs/sites/default/files/ddi3/editor-lite-3/DDI_v2dot2.htm)**: Authoring tool produced by ICPSR that supports production of DDI 3.0 instances.
      - **[DdiEditor](http://code.google.com/p/ddieditor/)**: Key tool in a framework of data processing tools and processes for survey datasets.
      - **[DDI with R](https://cran.r-project.org/web/packages/DDIwR/index.html)**: R package to create, edit, and validate DDI Codebook 2.6 using R commands.
  - subcategory: Data Documentation
    content: |
      - **[Colectica for Excel](https://www.colectica.com/software/colecticaforexcel/)**: Free tool to document spreadsheet data using the DDI standard.
- category: Survey & Data Collection Tools
  subcategories:
  - subcategory: Questionnaire Design
    content: |
      Visual tooling to design questionnaire specifications and generate outputs across multiple modes (web, paper, interviewer). These tools frequently integrate with repositories or generators to produce DDI, PDF, and runtime artifacts.

      - **[Colectica Designer](http://www.colectica.com/products/designer/)**: Visual DDI metadata editor and survey questionnaire designer.
      - **[Colectica Questionnaires](https://www.colectica.com/software/questionnaires/)**: Survey specification creator with multi-format publishing and question bank integration.
      - **[Pogues](https://github.com/InseeFr/Pogues)**: Questionnaire design visual tool producing DDI descriptions, integrated with Eno.
      - **[QDDT](https://github.com/DASISH/qddt-client/wiki)**: Interactive, dynamic web-based tool for questionnaire design and documentation.
      - **[queXML](https://quexml.acspri.org.au)**: Simple XML schema for designing questionnaires, compatible with DDI.
  - subcategory: Questionnaire Generation
    content: |
      - **[Eno](https://github.com/InseeFr/Eno)**: Metadata-driven survey data collection process including a questionnaire generator developed by Insee.
  - subcategory: Data Collection & Entry
    content: |
      - **[EpiData Software](http://www.epidata.dk/)**: Software package for data definitions, documentation, entry, and analysis based on DDI standards.
- category: DDI Transformation & Processing
  subcategories:
  - subcategory: Converters
    content: |
      Tools for converting datasets and metadata between DDI and other formats, supporting interoperability and migration across platforms.

      - **[StatConverter](https://roda.github.io/StatConverter/)**: Cross-platform software to convert major statistical software datasets to DDI Codebook.
      - **[DDI to DDL](http://sda.berkeley.edu/ddi/tools/)**: Online DDI to DDL conversion service.
      - **[XCONVERT](http://sda.berkeley.edu/ddi/tools/)**: Tool to convert SAS, SPSS, and Stata data definitions to DDI.
      - **[DDI DExT](http://www.docstoc.com/docs/159004579/Quantitative-DExT-project---DExT---UK-Data-Archive)**: Tool to import data and DDI metadata from SPSS files with conversion to ASCII and re-export to SAS, Stata, and SPSS.
  - subcategory: Transformation
    content: |
      Tools for transforming DDI metadata into other formats, such as HTML, RDF, or DataCite, using XSLT or similar technologies.

      - **[DDI-XSLT](https://github.com/MetadataTransform/ddi-xslt)**: Collection of XSLT stylesheets for transforming DDI to other formats.
      - **[DDI to HTML Stylesheet](http://www.icpsr.umich.edu)**: Tool to transform and format content of DDI documents as HTML pages.
- category: DDI Repositories & Discovery
  content: |
    Repositories and search engines for DDI metadata, enabling indexing, discovery, and access to data documentation and survey content.
  subcategories:
  - subcategory: Repositories & Catalogues
    content: |
      - **[Microdata Cataloging Tool (NADA)](https://nada.ihsn.org/)**: Web-based cataloging system for researchers to browse, search, compare, and download census or survey information.
      - **[CED2AR](https://www.ncrn.cornell.edu/projects/#Metadata_Standards_and_Tools)**: Lightweight DDI 2.5 repository for data documentation and access.
      - **[Colectica Portal](http://www.colectica.com/products/web/)**: Web application for data and metadata publication and discovery.
      - **[Colectica Repository](http://www.colectica.com/products/repository/)**: Centralised storage system for managing DDI data resources, collaborative workflows, and version control.
  - subcategory: Search & Indexing
    content: |
      - **[DDI Index](http://assda.anu.edu.au/ddiindex.html)**: Java/JavaScript application for indexing and searching XML files created in DDI format.
  - subcategory: Identifier Resolution
    content: |
      Services and libraries for resolving DDI agency identifiers and related metadata, supporting interoperability and persistent referencing.

      - **[Colectica Resolver](http://resolver.colectica.com)**: DNS-based resolution service for DDI3 agency identifiers and related metadata.
      - **[Colectica Resolver Library](http://resolver.colectica.com/Home/Develop)**: Library for integrating DNS-based data resolution in applications (.NET and Java).
- category: Statistical & Research Data Tools
  subcategories:
  - subcategory: Data Protection
    content: |
      Tools for anonymisation and protection of statistical data, supporting disclosure control and privacy for DDI-compliant datasets.

      - **[DDI Data Description Statistics Protection Software](http://www.adp.fdv.uni-lj.si/eng/za_uporabnike/usposabljanje_uporabnikov/orodje_zascita_statistik/)**: Tool for anonymisation of DDI-standard univariate statistics, protecting aggregated data directly in XML.
  - subcategory: Data Analysis & Preparation
    content: |
      - **[EpiData Software](http://www.epidata.dk/)**: Software package for data definitions, documentation, entry, and analysis based on DDI standards.
- category: DDI Profiles
  subcategories:
  - subcategory: Profile Tooling
    content: |
      - **[DDIProfileXSLT](http://www.ddialliance.org/node/918)**: XSLT scripts to create and render DDI Profiles in HTML.
  - subcategory: DDI Lifecycle 3.0
    content: |
      - **[DDI 3.0 Core](https://ddialliance.org/hubfs/sites/default/files/bp/CORE_Profile_FinalDDI3.xml)**: Recommended elements for DDI 3.0, formerly DDI Lite.
  - subcategory: DDI Lifecycle 3.2
    content: |
      - **[GSIM DDI Profiles](https://statswiki.unece.org/spaces/gsim/pages/97356545/DDI+Profiles)**: BTO Profile - The first profile is "Basic Technical Objects" (BTO). There are a small set of technical objects that are used in DDI to support identification, referencing, dates, external controlled vocabularies, string content, and the basic features of ISO/IEC 11179-5 (Name, Label, Description). This profile provides guidance for the best practice usage of these technical objects to support interoperability. In particular it identifies those objects which should be considered interoperable and applied in a consistent manner, and those that contain primarily local information. Variable Profile- This profile covers those DDI objects required to support the Variable, Population and Concept objects in GSIM. Represented Variable Profile - This profile covers those DDI objects required to support the Represented Variable, Enumerated Value Domain, Described Value Domain and Unit of Measure objects in GSIM. Questionnaire Profile - This is the definition of a 3.2 DDI profile for business questionnaire - test version. This profile includes all the objects, schemes and 'packaging' information needed to create a complete questionnaire, including Questions, Question Groups and Blocks, Statements, Interviewer Instructions, Controls and Instrument. Codelist Profile - This profile covers those DDI objects required to support Code Lists and Category Sets in GSIM.
- category: DDI Examples
  subcategories:
  - subcategory: DDI Lifecycle 3.1
    content: |
      - **[Colectica DDI Examples](https://github.com/Colectica/ddi-examples/tree/master)**: The Data Documentation Initiative (DDI) is an effort to create an international standard for describing social science and statistical data. The DDI 3 metadata specification covers the entire data lifecycle, and Colectica allows a user to automatically capture this valuable information automatically.
