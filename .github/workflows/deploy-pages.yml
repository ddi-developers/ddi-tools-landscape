name: Build and deploy landscape

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LANDSCAPE2_VERSION: v1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate data.yml and guide.yml
        run: python3 scripts/build_data.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves project sites from a subpath
      # (e.g. https://<org>.github.io/<repo>/), so set url and base_path
      # in a CI-only copy of the settings. settings.yml stays usable for
      # local builds served from the root.
      - name: Set url and base_path for GitHub Pages
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'EOF'
          import os, yaml
          with open("settings.yml") as f:
              settings = yaml.safe_load(f)
          settings["url"] = os.environ["PAGES_BASE_URL"].rstrip("/")
          base_path = os.environ["PAGES_BASE_PATH"].rstrip("/")
          if base_path:
              settings["base_path"] = base_path
          else:
              settings.pop("base_path", None)
          with open("settings.pages.yml", "w") as f:
              yaml.safe_dump(settings, f, sort_keys=False, allow_unicode=True)
          print(f"url={settings['url']} base_path={settings.get('base_path', '')}")
          EOF

      - name: Install landscape2
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cncf/landscape2/releases/download/${LANDSCAPE2_VERSION}/landscape2-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build landscape
        run: |
          landscape2 build \
            --data-file data.yml \
            --settings-file settings.pages.yml \
            --guide-file guide.yml \
            --games-file games.yml \
            --logos-path logos \
            --output-dir build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
